<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Новый покупатель</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h1>Новый покупатель</h1>

    <form th:action="@{/buyers/create}" th:object="${buyer}" method="post">
        <p>Фамилия: <input type="text" th:field="*{surname}" class="form-control"/></p>
        <p>Имя: <input type="text" th:field="*{name}" class="form-control"/></p>
        <p>Отчество: <input type="text" th:field="*{patronymic}" class="form-control"/></p>
        <p>Пол: <input type="text" th:field="*{gender}" class="form-control"/></p>
        <p>Национальность: <input type="text" th:field="*{nationality}" class="form-control"/></p>
        <p>Рост: <input type="number" th:field="*{height}" class="form-control"/></p>
        <p>Вес: <input type="number" th:field="*{weight}" class="form-control"/></p>
        <p>Дата рождения: <input type="date" th:field="*{birthDate}" class="form-control"/></p>
        <p>Телефон: <input type="text" th:field="*{phoneNumber}" class="form-control"/></p>
        <p>Кредитная карта: <input type="text" th:field="*{creditCardNumber}" class="form-control"/></p>
        <p>Банковский счёт: <input type="text" th:field="*{bankAccountNumber}" class="form-control"/></p>

        <p>
            <input type="submit" value="Отправить" class="btn btn-success"/>
            <input type="reset" value="Сброс" class="btn btn-secondary"/>
        </p>
    </form>
</div>
</body>
</html>
